spring:
  application:
    name: svcmon-hub
  web:
    resources:
      # The hub serves no classpath files; the web UI (if any) comes from svcmon.ui-dir.
      add-mappings: false
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  # TLS is terminated at the load balancer; the hub speaks plain HTTP behind it.
  # Firewall this port to the load balancer and the internal network only.
  port: 8080
  # Trust X-Forwarded-For / X-Forwarded-Proto from private-range proxies so client
  # addresses in logs are real. The load balancer must overwrite client-supplied values.
  # If it is not in a private range, set server.tomcat.remoteip.internal-proxies.
  forward-headers-strategy: native

svcmon:
  # SQLite database lives here (created on first start).
  data-dir: ./data
  # Raw check results older than this are deleted.
  retention-days: 30
  # How often agents are told to send a heartbeat/report.
  agent-heartbeat-seconds: 30
  # An agent that has not reported for this long is shown as offline.
  agent-stale-seconds: 90
  # Optional: serve the web dashboard from this folder (the UI project's dist folder), so it shares the
  # hub's address. Unset means the hub serves no UI.
  # ui-dir: ./ui
  # Optional: exact origins that may call the API from a browser, for a dashboard hosted on another
  # address (list entries like https://monitor.example.com, no path, no '*'). Empty means CORS is off.
  # cors-allowed-origins:
  #   - https://monitor.example.com
  # Optional: use this value as the initial admin token instead of generating one.
  # bootstrap-admin-token:
  # Set true to print an additional new admin token at startup (token recovery).
  new-admin-token: false
  # Optional: accept OpenID Connect access tokens (JWTs) from Keycloak or another provider as Authorization:
  # Bearer values, checked here: signature (keys found through the issuer's discovery document), issuer, audience
  # and expiry. A token holding admin-role in roles-claim gets the access of an ADMIN token; the hub's own API
  # tokens keep working either way. Setting issuer turns it on; audience and admin-role are then required.
  # jwt:
  #   issuer: https://auth.example.com/realms/main
  #   audience: https://monitor.example.com/api
  #   admin-role: platform-admin
  #   roles-claim: realm_access.roles
  #   jwks-uri: https://auth.example.com/realms/main/protocol/openid-connect/certs
  # Optional: the hub's own administrator, for when nothing else works. On by default: the first start prints
  # a random password once. Only a salted hash is stored. Signing in at POST /api/v1/login returns an ADMIN token.
  # local-admin:
  #   enabled: true
  #   username: admin
  #   password: choose-12-to-128-characters   # only used to create the account
  #   new-password: false                     # true prints a new password at start-up (recovery)
  #   session-hours: 12
  # Optional: the address people open the dashboard at (a path is fine; no query or fragment). Alert emails then
  # get an "Open in dashboard" button linking to the affected server. Unset means no button.
  # public-url: https://monitor.example.com
  # Optional: let agents declare their own checks in a checks.json file beside their config. Off by default, so only
  # the admin lists what is monitored. A declared check replaces the hub's settings for that check; the limit is per server.
  # agent-declared-checks: false
  # agent-declared-checks-limit: 200
  # Optional: let Slack and Discord alert URLs use http instead of https. For tests and local receivers only.
  # allow-insecure-alert-urls: false
  # Optional: most dashboards that may hold the live WebSocket (/api/v1/live) open at once.
  # live-max-sessions: 50
  # Optional: waits between delivery attempts for a failing alert channel, in milliseconds.
  # alert-retry-delays-ms: 0,2000,5000
