name: Release

# Builds every release file from one tag and leaves them in a DRAFT GitHub release, which a person publishes by
# hand after looking at it. Push a tag such as v0.1.0 to this repository (RELEASING.md has the steps). The dashboard
# repository must carry the same tag first: its build goes inside the hub jar.
#
# Started by hand from the Actions tab it builds everything the same way and uploads the files as a workflow
# artifact instead, creating no release, so a release can be rehearsed with any version number.
#
# Files: the hub jar (dashboard inside), a Windows service zip, a Linux service tarball, the agent and CLI for seven
# platforms, the dashboard alone, and SHA256SUMS. Nothing is signed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, for example 0.1.0-test. Nothing is published.
        required: true
        default: 0.0.0-test
      ui_ref:
        description: Branch or tag of service-monitor-ui to build the dashboard from.
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UI_REPO: primelogiclabio/service-monitor-ui

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      ui_ref: ${{ steps.v.outputs.ui_ref }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_UI_REF: ${{ inputs.ui_ref }}
        run: |
          if [ "$EVENT" = "push" ]; then
            tag=$REF_NAME
            version=${tag#v}
            ui_ref=$tag
            publish=true
          else
            version=$INPUT_VERSION
            tag=v$version
            ui_ref=$INPUT_UI_REF
            publish=false
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$version' is not a version like 0.1.0 or 0.1.0-rc.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ui_ref=$ui_ref" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Building $version (publish: $publish, dashboard from $ui_ref)"
      - name: The dashboard repository carries the tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if ! git ls-remote --exit-code --tags "https://github.com/$UI_REPO" "refs/tags/$TAG" >/dev/null; then
            echo "::error::$UI_REPO has no tag $TAG. Tag it first (RELEASING.md), then run this workflow again."
            exit 1
          fi

  dashboard:
    name: dashboard
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UI_REPO }}
          ref: ${{ needs.version.outputs.ui_ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: The dashboard alone, for hosting it elsewhere
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p out
          (cd dist && zip -qr "../out/service-monitor-ui-$VERSION-dist.zip" .)
      # The hub builds its own config.json from its settings, so the copy that goes inside the jar leaves it out.
      - run: rm dist/config.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-for-hub
          path: dist
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dashboard
          path: out/*
          if-no-files-found: error

  hub:
    name: hub jar
    needs: [version, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard-for-hub
          path: hub/src/main/resources/ui
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set the version from the tag
        working-directory: hub
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
      - name: Build and test the jar, with the dashboard inside
        working-directory: hub
        run: mvn -B -ntp verify
      - name: The jar carries the dashboard and the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          jar="hub/target/svcmon-hub-$VERSION.jar"
          test -f "$jar"
          unzip -l "$jar" | grep -q 'BOOT-INF/classes/ui/index.html'
          mkdir -p out
          cp "$jar" "out/svcmon-hub-$VERSION.jar"
          bash .github/release/smoke-hub-jar.sh "out/svcmon-hub-$VERSION.jar" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-hub-jar
          path: out/*
          if-no-files-found: error

  windows-package:
    name: windows service zip
    needs: [version, hub]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-hub-jar
          path: jar
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      # build-package.ps1 downloads WinSW and refuses it unless it matches the SHA-256 pinned in install.ps1.
      - name: Build the package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File hub\service\windows\build-package.ps1 -JarPath "jar\svcmon-hub-$env:VERSION.jar" -OutDir out
      - name: The unzipped package plans an install (changes nothing)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: pwsh
        run: |
          Expand-Archive "out/svcmon-hub-$env:VERSION-windows-x64.zip" -DestinationPath check
          Push-Location "check/svcmon-hub-$env:VERSION-windows-x64"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -DryRun
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -DryRun exited $LASTEXITCODE" }
          Pop-Location
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-package
          path: out/*.zip
          if-no-files-found: error

  linux-package:
    name: linux service tarball
    needs: [version, hub]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-hub-jar
          path: jar
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          name="svcmon-hub-$VERSION-linux"
          mkdir -p "stage/$name" out
          cp "jar/svcmon-hub-$VERSION.jar" hub/service/linux/install.sh hub/service/linux/uninstall.sh \
             hub/service/linux/svcmon-hub.service LICENSE NOTICE "stage/$name/"
          cp hub/service/README.md "stage/$name/README.md"
          chmod 755 "stage/$name/install.sh" "stage/$name/uninstall.sh"
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf "out/$name.tar.gz" -C stage "$name"
      - name: The unpacked tarball plans an install (changes nothing)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tar -xzf "out/svcmon-hub-$VERSION-linux.tar.gz"
          cd "svcmon-hub-$VERSION-linux"
          ./install.sh --dry-run | tee plan.txt
          grep -q "svcmon-hub-$VERSION.jar -> /opt/svcmon-hub/svcmon-hub.jar" plan.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-package
          path: out/*.tar.gz
          if-no-files-found: error

  agent:
    name: agent and cli
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: Build every platform
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p ../out
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 freebsd/amd64; do
            os=${target%/*}
            arch=${target#*/}
            ext=""
            [ "$os" = windows ] && ext=".exe"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X svcmon/internal/cli.Version=$VERSION" \
              -o "../out/svcmon-agent-$VERSION-$os-$arch$ext" ./cmd/svcmon
            echo "built $os/$arch"
          done
      - name: The Linux build reports the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          out=$("../out/svcmon-agent-$VERSION-linux-amd64" version)
          echo "$out"
          [ "$out" = "svcmon $VERSION (linux/amd64)" ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-agent
          path: out/*
          if-no-files-found: error

  release:
    name: checksums and draft release
    needs: [version, dashboard, hub, windows-package, linux-package, agent]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: files
      - name: Checksums
        working-directory: files
        run: |
          ls -l
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS
      - name: Create the draft release
        if: needs.version.outputs.publish == 'true'
        run: |
          sed "s/@VERSION@/$VERSION/g" .github/release/notes.md > notes.md
          flags=(--draft --verify-tag --title "Service Monitor $VERSION" --notes-file notes.md)
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" files/* "${flags[@]}"
      - name: Keep the files (a rehearsal publishes nothing)
        if: needs.version.outputs.publish != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files-rehearsal
          path: files/*
          retention-days: 7
          if-no-files-found: error
