name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub:
    name: hub (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn -B -ntp test

  agent:
    name: agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Cross-compile every supported platform
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '0'
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 freebsd/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -o /dev/null ./cmd/svcmon
            echo "built $target"
          done

  # Installs the hub as a real service (WinSW on Windows, systemd on Linux), checks it, upgrades it and
  # removes it again. The hosted runners are elevated and the Linux ones run systemd.
  hub-service:
    name: hub service (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the hub jar
        working-directory: hub
        run: mvn -B -ntp -DskipTests package
      - name: Install, check, upgrade and remove the service
        if: runner.os == 'Linux'
        run: sudo env "PATH=$PATH" bash hub/service/linux/smoke-test.sh
      - name: Install, check, upgrade and remove the service
        if: runner.os == 'Windows'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File hub\service\windows\smoke-test.ps1

  # One stable name to require on main, so the matrix above can change without touching branch protection.
  ci-ok:
    name: CI passed
    if: always()
    needs: [hub, agent, hub-service]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        run: |
          echo "hub: ${{ needs.hub.result }}, agent: ${{ needs.agent.result }}, hub-service: ${{ needs.hub-service.result }}"
          if [ "${{ needs.hub.result }}" != "success" ] || [ "${{ needs.agent.result }}" != "success" ] || [ "${{ needs.hub-service.result }}" != "success" ]; then
            exit 1
          fi
