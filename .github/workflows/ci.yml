name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Documentation-only changes (Markdown, docs/, LICENSE, NOTICE) skip the build and test jobs below, so they cost
  # almost no runner minutes. The aggregate "CI passed" check still runs and reports, because main requires it.
  # If the list of changed files cannot be read, or is empty, everything runs.
  changes:
    name: changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          files=""
          if [ "$EVENT" = "pull_request" ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)') || files=""
          elif [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[] | .filename, (.previous_filename // empty)') || files=""
          fi
          if [ -z "$files" ]; then
            echo "No changed-file list; running everything."
            code=true
          elif echo "$files" | grep -qvxE '(docs/.*|LICENSE|NOTICE|.*\.md)'; then
            echo "Code changed; running everything."
            code=true
          else
            echo "Documentation only; skipping the build and test jobs:"
            echo "$files"
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  hub:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: hub (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn -B -ntp test

  agent:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Cross-compile every supported platform
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '0'
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 freebsd/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -o /dev/null ./cmd/svcmon
            echo "built $target"
          done

  # The service installers are only ever dry-run here: the plan is printed, bad input is refused and nothing on the
  # runner changes. The real install and uninstall tests are in installer-smoke.yml and run only when started by hand.
  installer-dry-run:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: installer dry run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the hub jar
        working-directory: hub
        run: mvn -B -ntp -DskipTests package
      - name: Dry run
        if: runner.os == 'Linux'
        run: bash hub/service/linux/dry-run-test.sh
      - name: Dry run as root, including the prompt
        if: runner.os == 'Linux'
        run: sudo env "PATH=$PATH" bash hub/service/linux/dry-run-test.sh
      - name: Dry run
        if: runner.os == 'Windows'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File hub\service\windows\dry-run-test.ps1

  # One stable name to require on main, so the matrix above can change without touching branch protection.
  # For a code change every job must succeed; for a documentation-only change they must all have been skipped.
  ci-ok:
    name: CI passed
    if: always()
    needs: [changes, hub, agent, installer-dry-run]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          HUB: ${{ needs.hub.result }}
          AGENT: ${{ needs.agent.result }}
          DRY_RUN: ${{ needs.installer-dry-run.result }}
        run: |
          echo "changes: $CHANGES (code=$CODE), hub: $HUB, agent: $AGENT, installer-dry-run: $DRY_RUN"
          [ "$CHANGES" = "success" ] || exit 1
          if [ "$CODE" = "true" ]; then
            want=success
          else
            echo "Documentation-only change: the build and test jobs were skipped."
            want=skipped
          fi
          for result in "$HUB" "$AGENT" "$DRY_RUN"; do
            [ "$result" = "$want" ] || exit 1
          done
